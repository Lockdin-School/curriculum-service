[package]
name = "lockdinschoolserver"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.12.1"
log = "0.4.29"
env_logger = "0.11.8"
dotenv = "0.15.0"
serde = { version = "1.0.148", features = ["derive"] }
actix-cors = "0.7.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres"] }
async-trait = "0.1.89"
uuid = { version = "1.20.0", features = ["serde", "v4", "v7"] }
chrono = { version = "0.4.43", features = ["serde"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "full"] }
rand = "0.8"