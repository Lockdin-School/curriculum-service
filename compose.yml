services:
  app:
    build: .
    container_name: web-server
    ports:
      - "8080:8080"
#    environment:
#      - RUST_LOG=${RUST_LOG:-info}
#      - DATABASE_URL=${DATABASE_URL}
#      - REDIS_URL=${REDIS_URL}
#      - JWT_SECRET=${JWT_SECRET}
#      - RESEND_API_KEY=${RESEND_API_KEY}
    env_file:
      - .env
    networks:
      - lockdin-net
    depends_on:
      - db
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src