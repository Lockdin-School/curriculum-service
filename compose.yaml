services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: web-server
    ports:
      - "8080:8080"
#    environment:
#      - RUST_LOG=${RUST_LOG:-info}
#      - DATABASE_URL=${DATABASE_URL}
#      - REDIS_URL=${REDIS_URL}
#      - JWT_SECRET=${JWT_SECRET}
#      - RESEND_API_KEY=${RESEND_API_KEY}
    env_file:
      - .env
    networks:
      - lockdin-net
    depends_on:
      - db
  db:
    container_name: postgresdb
    image: postgres:16-alpine
    command: -p 5433
    ports:
      - "5433:5433"
    env_file:
      - .env
    networks:
      - lockdin-net
    volumes:
      - lockdin-storage:/var/lib/postgresql/data


volumes:
  lockdin-storage:

networks:
  lockdin-net: